rule_files:
  - ../rules/application-health.yml

evaluation_interval: 30s

tests:
  - name: healthy application has no alert
    interval: 30s
    input_series:
      - series: 'up{job="telegraf-health",instance="telegraf:9273"}'
        values: '1x10'
      - series: 'http_response_result_code{job="telegraf-health",instance="telegraf:9273",service="tomcat",check="application-health"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: TelegrafHealthScrapeUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: TomcatApplicationHealthMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: TomcatApplicationHealthFailed
        exp_alerts: []

  - name: failed application fires and resolves
    interval: 30s
    input_series:
      - series: 'up{job="telegraf-health",instance="telegraf:9273"}'
        values: '1x10'
      - series: 'http_response_result_code{job="telegraf-health",instance="telegraf:9273",service="tomcat",check="application-health"}'
        values: '1x5 0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: TomcatApplicationHealthFailed
        exp_alerts:
          - exp_labels:
              alertname: TomcatApplicationHealthFailed
              check: application-health
              instance: telegraf:9273
              job: telegraf-health
              service: tomcat
              severity: critical
              tomcat_instance: default
            exp_annotations:
              summary: Tomcat application health failed
              description: >-
                Tomcat application-health result for telegraf:9273 has
                remained unsuccessful with value 1.
      - eval_time: 3m
        alertname: TomcatApplicationHealthFailed
        exp_alerts: []

  - name: missing health metric fires without scrape alert
    interval: 30s
    input_series:
      - series: 'up{job="telegraf-health",instance="telegraf:9273"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: TomcatApplicationHealthMetricsMissing
        exp_alerts:
          - exp_labels:
              alertname: TomcatApplicationHealthMetricsMissing
              check: application-health
              instance: telegraf:9273
              job: telegraf-health
              service: tomcat
              severity: warning
              tomcat_instance: default
            exp_annotations:
              summary: Tomcat application-health metrics missing
              description: >-
                Telegraf target telegraf:9273 is scrapeable, but the expected
                Tomcat application-health result series is missing.
      - eval_time: 2m
        alertname: TelegrafHealthScrapeUnavailable
        exp_alerts: []

  - name: scrape unavailable fires without missing metric alert
    interval: 30s
    input_series:
      - series: 'up{job="telegraf-health",instance="telegraf:9273"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: TelegrafHealthScrapeUnavailable
        exp_alerts:
          - exp_labels:
              alertname: TelegrafHealthScrapeUnavailable
              check: application-health
              instance: telegraf:9273
              job: telegraf-health
              service: tomcat
              severity: critical
              tomcat_instance: default
            exp_annotations:
              summary: Telegraf application-health scrape unavailable
              description: >-
                Prometheus cannot scrape Telegraf target telegraf:9273;
                application health is unknown.
      - eval_time: 2m
        alertname: TomcatApplicationHealthMetricsMissing
        exp_alerts: []

  - name: JMX exporter reachable has no TomcatDown alert
    interval: 30s
    input_series:
      - series: 'up{job="tomcat-jmx-exporter",instance="tomcat-jmx-exporter:9404"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: TomcatDown
        exp_alerts: []

  - name: JMX exporter unreachable fires TomcatDown after 2 minutes
    interval: 30s
    input_series:
      - series: 'up{job="tomcat-jmx-exporter",instance="tomcat-jmx-exporter:9404"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: TomcatDown
        exp_alerts:
          - exp_labels:
              alertname: TomcatDown
              check: runtime-availability
              instance: tomcat-jmx-exporter:9404
              job: tomcat-jmx-exporter
              service: tomcat
              severity: critical
              tomcat_instance: default
            exp_annotations:
              summary: Tomcat JMX Exporter target unreachable
              description: >-
                Prometheus cannot scrape JMX Exporter target
                tomcat-jmx-exporter:9404; Tomcat may be down or unreachable.

  - name: JMX exporter recovery resolves TomcatDown
    interval: 30s
    input_series:
      - series: 'up{job="tomcat-jmx-exporter",instance="tomcat-jmx-exporter:9404"}'
        values: '0x5 1x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: TomcatDown
        exp_alerts:
          - exp_labels:
              alertname: TomcatDown
              check: runtime-availability
              instance: tomcat-jmx-exporter:9404
              job: tomcat-jmx-exporter
              service: tomcat
              severity: critical
              tomcat_instance: default
            exp_annotations:
              summary: Tomcat JMX Exporter target unreachable
              description: >-
                Prometheus cannot scrape JMX Exporter target
                tomcat-jmx-exporter:9404; Tomcat may be down or unreachable.
      - eval_time: 3m
        alertname: TomcatDown
        exp_alerts: []

  - name: Diagnostic Service reachable has no DiagnosticServiceDown alert
    interval: 30s
    input_series:
      - series: 'up{job="tomcat-diagnostic-service",instance="diagnostic-service:8443"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: DiagnosticServiceDown
        exp_alerts: []

  - name: Diagnostic Service unreachable fires DiagnosticServiceDown after 1 minute
    interval: 30s
    input_series:
      - series: 'up{job="tomcat-diagnostic-service",instance="diagnostic-service:8443"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: DiagnosticServiceDown
        exp_alerts:
          - exp_labels:
              alertname: DiagnosticServiceDown
              check: service-availability
              instance: diagnostic-service:8443
              job: tomcat-diagnostic-service
              service: diagnostic-service
              severity: critical
            exp_annotations:
              summary: Diagnostic Service target unreachable
              description: >-
                Prometheus cannot scrape Diagnostic Service target
                diagnostic-service:8443; automated incident notification
                pipeline is disconnected. Operator must inspect the service
                container immediately.

  - name: Diagnostic Service recovery resolves DiagnosticServiceDown
    interval: 30s
    input_series:
      - series: 'up{job="tomcat-diagnostic-service",instance="diagnostic-service:8443"}'
        values: '0x3 1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: DiagnosticServiceDown
        exp_alerts:
          - exp_labels:
              alertname: DiagnosticServiceDown
              check: service-availability
              instance: diagnostic-service:8443
              job: tomcat-diagnostic-service
              service: diagnostic-service
              severity: critical
            exp_annotations:
              summary: Diagnostic Service target unreachable
              description: >-
                Prometheus cannot scrape Diagnostic Service target
                diagnostic-service:8443; automated incident notification
                pipeline is disconnected. Operator must inspect the service
                container immediately.
      - eval_time: 2m
        alertname: DiagnosticServiceDown
        exp_alerts: []

