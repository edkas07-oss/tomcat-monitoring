global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    environment: lab
    host: tomcat-01

rule_files:
  - /etc/prometheus/rules/*.yml
  - rules/*.yml

alerting:
  alertmanagers:
    - api_version: v2
      static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: tomcat-jmx-exporter
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /run/secrets/tomcat-monitoring/jmx-exporter-ca.crt
      insecure_skip_verify: false
    static_configs:
      - targets:
          - tomcat-jmx-exporter:9404

  - job_name: telegraf-health
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - telegraf:9273

  - job_name: tomcat-diagnostic-service
    scheme: https
    metrics_path: /health
    scrape_interval: 15s
    scrape_timeout: 5s
    tls_config:
      ca_file: /run/secrets/tomcat-monitoring/diagnostic-service-ca.crt
      insecure_skip_verify: false
    static_configs:
      - targets:
          - diagnostic-service:8443

