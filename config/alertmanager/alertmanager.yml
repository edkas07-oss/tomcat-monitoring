global:
  resolve_timeout: 5m

route:
  receiver: lab-mailpit
  group_by:
    - alertname
    - job
    - instance
    - service
    - check
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: lab-mailpit
    email_configs:
      - to: operator@tomcat-monitoring.invalid
        from: alertmanager@tomcat-monitoring.invalid
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true
        headers:
          Subject: '[Tomcat Monitoring][{{ if eq .Status "resolved" }}normal{{ else }}{{ .CommonLabels.severity }}{{ end }}] {{ if eq .Status "resolved" }}{{ if eq .CommonLabels.alertname "TelegrafHealthScrapeUnavailable" }}TelegrafHealthScrapeAvailable{{ else if eq .CommonLabels.alertname "TomcatApplicationHealthMetricsMissing" }}TomcatApplicationHealthMetricsAvailable{{ else if eq .CommonLabels.alertname "TomcatApplicationHealthFailed" }}TomcatApplicationHealthNormal{{ else }}{{ .CommonLabels.alertname }}{{ end }}{{ else }}{{ .CommonLabels.alertname }}{{ end }} - {{ .CommonLabels.instance }}'
        html: |
          <!DOCTYPE html>
          <html lang="en">
            <body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#202124;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f3f4f6;padding:24px 12px;">
                <tr>
                  <td align="center">
                    <table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:640px;background-color:#ffffff;border:1px solid #d9dde3;border-radius:4px;overflow:hidden;">
                      <tr>
                        {{ if eq .Status "resolved" }}
                        <td style="background-color:#2e7d32;color:#ffffff;padding:20px 24px;text-align:center;font-size:18px;font-weight:bold;">Tomcat Monitoring — normal</td>
                        {{ else if eq .CommonLabels.severity "critical" }}
                        <td style="background-color:#c62828;color:#ffffff;padding:20px 24px;text-align:center;font-size:18px;font-weight:bold;">Tomcat Monitoring — critical</td>
                        {{ else }}
                        <td style="background-color:#ef6c00;color:#ffffff;padding:20px 24px;text-align:center;font-size:18px;font-weight:bold;">Tomcat Monitoring — warning</td>
                        {{ end }}
                      </tr>
                      <tr>
                        <td style="padding:24px;">
                          <h2 style="margin:0 0 16px 0;">Monitoring Alert</h2>
                          <table role="presentation" width="100%" cellspacing="0" cellpadding="6" border="0" style="border-collapse:collapse;font-size:14px;">
                            <tr><td style="font-weight:bold;border-bottom:1px solid #eceff1;">Alert name</td><td style="border-bottom:1px solid #eceff1;">{{ if eq .Status "resolved" }}{{ if eq .CommonLabels.alertname "TelegrafHealthScrapeUnavailable" }}TelegrafHealthScrapeAvailable{{ else if eq .CommonLabels.alertname "TomcatApplicationHealthMetricsMissing" }}TomcatApplicationHealthMetricsAvailable{{ else if eq .CommonLabels.alertname "TomcatApplicationHealthFailed" }}TomcatApplicationHealthNormal{{ else }}{{ .CommonLabels.alertname }}{{ end }}{{ else }}{{ .CommonLabels.alertname }}{{ end }}</td></tr>
                            <tr><td style="font-weight:bold;border-bottom:1px solid #eceff1;">Instance</td><td style="border-bottom:1px solid #eceff1;">{{ .CommonLabels.instance }}</td></tr>
                            <tr><td style="font-weight:bold;border-bottom:1px solid #eceff1;">Job</td><td style="border-bottom:1px solid #eceff1;">{{ .CommonLabels.job }}</td></tr>
                            <tr><td style="font-weight:bold;border-bottom:1px solid #eceff1;">Severity</td><td style="border-bottom:1px solid #eceff1;">{{ if eq .Status "resolved" }}normal{{ else }}{{ .CommonLabels.severity }}{{ end }}</td></tr>
                            <tr><td style="font-weight:bold;border-bottom:1px solid #eceff1;">Service</td><td style="border-bottom:1px solid #eceff1;">{{ .CommonLabels.service }}</td></tr>
                            <tr><td style="font-weight:bold;border-bottom:1px solid #eceff1;">Check</td><td style="border-bottom:1px solid #eceff1;">{{ .CommonLabels.check }}</td></tr>
                            <tr><td style="font-weight:bold;">Description</td><td>{{ if eq .Status "resolved" }}{{ if eq .CommonLabels.alertname "TelegrafHealthScrapeUnavailable" }}Prometheus can scrape Telegraf target {{ .CommonLabels.instance }}; application health monitoring is available.{{ else if eq .CommonLabels.alertname "TomcatApplicationHealthMetricsMissing" }}Expected Tomcat application-health metrics are available.{{ else if eq .CommonLabels.alertname "TomcatApplicationHealthFailed" }}Tomcat application health has returned to normal.{{ else }}The alert condition has cleared. Monitoring has returned to normal.{{ end }}{{ else }}{{ range .Alerts }}{{ .Annotations.description }}{{ end }}{{ end }}</td></tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
          </html>
