global:
  resolve_timeout: 5m

route:
  receiver: integration-bridge
  group_by:
    - alertname
    - job
    - instance
    - service
    - check
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: integration-bridge
    webhook_configs:
      - url_file: /run/secrets/tomcat-monitoring/integration-bridge-webhook-url
        send_resolved: true
