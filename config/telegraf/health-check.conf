# Contract health check Tomcat untuk Telegraf.
#
# TOMCAT_HEALTH_URL wajib diberikan oleh environment runtime, misalnya:
# http://<tomcat-container>:8080/health. Nilai tersebut bukan secret dan tidak
# dikunci di source agar deployment dapat menentukan nama service sendiri.

[agent]
  interval = "30s"
  round_interval = true

[[inputs.http_response]]
  urls = ["${TOMCAT_HEALTH_URL:?TOMCAT_HEALTH_URL wajib diisi}"]
  method = "GET"
  response_timeout = "5s"
  response_status_code = 200
  response_string_match = "\"status\"\\s*:\\s*\"UP\""

  [inputs.http_response.tags]
    service = "tomcat"
    check = "application-health"

[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
  metric_version = 2
