# Tomcat health check contract for Telegraf.
#
# TOMCAT_HEALTH_URL must be provided by the runtime environment, e.g.:
# http://<tomcat-container>:8080/health. This is non-secret and configurable.

[agent]
  interval = "30s"
  round_interval = true

[[inputs.http_response]]
  urls = ["${TOMCAT_HEALTH_URL:?TOMCAT_HEALTH_URL is required}"]
  method = "GET"
  response_timeout = "5s"
  response_status_code = 200
  response_string_match = "\"status\"\\s*:\\s*\"UP\""

  [inputs.http_response.tags]
    service = "tomcat"
    check = "application-health"

[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
  metric_version = 2
