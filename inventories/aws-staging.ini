# ==============================================================================
# AWS Cloud Staging Environment Inventory for Tomcat Monitoring (Multi-OS)
# Architecture Reference: TM-ADR-0028, TN-017 & TN-018
# ==============================================================================

[linux_nodes]
aws-ec2-mon-01 ansible_host=184.194.25.77 ansible_user=ec2-user ansible_python_interpreter=/usr/bin/python3

[windows_nodes]
aws-ec2-win-01 ansible_host=3.210.194.165 ansible_user=Administrator ansible_connection=ssh ansible_shell_type=powershell

[monitoring_core:children]
linux_nodes

[tomcat_fleet:children]
linux_nodes
windows_nodes

[all:children]
monitoring_core
tomcat_fleet

[all:vars]
deploy_env=aws-staging
ansible_ssh_private_key_file="{{ lookup('env', 'ANSIBLE_SSH_KEY_FILE') | default('~/.ssh/tomcat-monitoring-aws-key.pem', true) }}"
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes'

[linux_nodes:vars]
container_engine=docker
project_root=/home/ec2-user/tomcat-monitoring
spool_dir=/home/ec2-user/.local/share/tomcat-monitoring/spool
secrets_dir=/home/ec2-user/.local/share/tomcat-monitoring/diagnostic-service-secrets
tls_dir=/home/ec2-user/.local/share/tomcat-monitoring/diagnostic-service-tls
jmx_tls_dir=/home/ec2-user/.local/share/tomcat-monitoring/jmx-exporter-tls
systemd_user_dir=/home/ec2-user/.config/systemd/user
tmctl_bin=/home/ec2-user/.local/bin/tmctl
tm_agent_bin=/home/ec2-user/.local/bin/tm-agent

[windows_nodes:vars]
container_engine=docker
project_root=C:\monitoring
spool_dir=C:\monitoring\spool
secrets_dir=C:\monitoring\secrets
tls_dir=C:\monitoring\tls
jmx_tls_dir=C:\monitoring\jmx-tls
tmctl_bin=C:\monitoring\bin\tmctl.exe
tm_agent_bin=C:\monitoring\bin\tm-agent.exe
