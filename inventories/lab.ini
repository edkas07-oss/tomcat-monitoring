# Lab Environment Inventory for Tomcat Monitoring
[monitoring_core]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[tomcat_fleet]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[all:children]
monitoring_core
tomcat_fleet

[all:vars]
deploy_env=lab
container_engine=podman
network_name=devops-lab
target_id=lab/tomcat-01/default
