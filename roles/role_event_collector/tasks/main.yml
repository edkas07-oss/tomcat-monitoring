---
# Deploy and daemonize Tomcat Diagnostic Event Collector (tm-agent)
# Architecture Reference: TM-ADR-0027, TN-013, TN-014, TN-018

# ==============================================================================
# Linux Branch (ansible_os_family != "Windows")
# ==============================================================================
- name: Ensure local user bin directory exists on Linux host
  ansible.builtin.file:
    path: "{{ ansible_env.HOME | default('/home/ansible') }}/.local/bin"
    state: directory
    mode: '0755'
  when: ansible_os_family != "Windows"

- name: Probe candidate paths for tm-agent Linux binary on control node
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ event_collector_bin_src }}"
    - "{{ playbook_dir }}/../tm-agent/bin/linux_amd64/tm-agent"
    - "{{ playbook_dir }}/bin/linux_amd64/tm-agent"
    - "{{ playbook_dir }}/bin/tm-agent"
    - "/home/eddywiyatno/git/tm-agent/bin/linux_amd64/tm-agent"
    - "{{ lookup('env', 'HOME') }}/.local/bin/tm-agent"
  register: tm_agent_linux_probes
  delegate_to: localhost
  when: ansible_os_family != "Windows"

- name: Resolve tm-agent Linux source binary path
  ansible.builtin.set_fact:
    tm_agent_resolved_src: "{{ (tm_agent_linux_probes.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"
  when: ansible_os_family != "Windows"

- name: Install tm-agent binary to local user bin if source available
  ansible.builtin.copy:
    src: "{{ tm_agent_resolved_src }}"
    dest: "{{ event_collector_bin_path }}"
    mode: '0755'
    remote_src: false
  when:
    - ansible_os_family != "Windows"
    - tm_agent_resolved_src | default('') | length > 0

- name: Ensure persistent spool directory exists with strict 0700 permissions
  ansible.builtin.file:
    path: "{{ event_collector_spool_dir }}"
    state: directory
    mode: '0700'
  when: ansible_os_family != "Windows"

- name: Deploy systemd user service unit file for tm-agent
  ansible.builtin.template:
    src: tm-agent.service.j2
    dest: "{{ event_collector_systemd_user_dir }}/{{ event_collector_service_name }}"
    mode: '0644'
  register: tm_agent_service_unit
  when: ansible_os_family != "Windows"

- name: Reload systemd user daemon on Linux host
  ansible.builtin.command: systemctl --user daemon-reload
  environment:
    XDG_RUNTIME_DIR: "{{ ansible_env.XDG_RUNTIME_DIR | default('/run/user/' ~ lookup('pipe', 'id -u')) }}"
    DBUS_SESSION_BUS_ADDRESS: "{{ ansible_env.DBUS_SESSION_BUS_ADDRESS | default('unix:path=/run/user/' ~ lookup('pipe', 'id -u') ~ '/bus') }}"
  when:
    - ansible_os_family != "Windows"
    - tm_agent_service_unit.changed
  ignore_errors: true

- name: Enable and start tm-agent systemd user daemon
  ansible.builtin.command: systemctl --user enable --now "{{ event_collector_service_name }}"
  environment:
    XDG_RUNTIME_DIR: "{{ ansible_env.XDG_RUNTIME_DIR | default('/run/user/' ~ lookup('pipe', 'id -u')) }}"
    DBUS_SESSION_BUS_ADDRESS: "{{ ansible_env.DBUS_SESSION_BUS_ADDRESS | default('unix:path=/run/user/' ~ lookup('pipe', 'id -u') ~ '/bus') }}"
  register: enable_tm_agent_res
  changed_when: "'Created symlink' in enable_tm_agent_res.stderr or 'Created symlink' in enable_tm_agent_res.stdout"
  when: ansible_os_family != "Windows"
  ignore_errors: true

- name: Verify tm-agent daemon status on Linux host
  ansible.builtin.command: systemctl --user is-active "{{ event_collector_service_name }}"
  environment:
    XDG_RUNTIME_DIR: "{{ ansible_env.XDG_RUNTIME_DIR | default('/run/user/' ~ lookup('pipe', 'id -u')) }}"
    DBUS_SESSION_BUS_ADDRESS: "{{ ansible_env.DBUS_SESSION_BUS_ADDRESS | default('unix:path=/run/user/' ~ lookup('pipe', 'id -u') ~ '/bus') }}"
  register: tm_agent_status
  failed_when: false
  changed_when: false
  when: ansible_os_family != "Windows"

# ==============================================================================
# Windows Branch (ansible_os_family == "Windows")
# ==============================================================================
- name: Ensure target directories exist on Windows host
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "C:\\monitoring\\bin"
    - "{{ event_collector_windows_spool_dir }}"
  when: ansible_os_family == "Windows"

- name: Probe candidate paths for tm-agent Windows binary on control node
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ playbook_dir }}/../tm-agent/bin/windows_amd64/tm-agent.exe"
    - "{{ playbook_dir }}/bin/windows_amd64/tm-agent.exe"
    - "/home/eddywiyatno/git/tm-agent/bin/windows_amd64/tm-agent.exe"
    - "{{ playbook_dir }}/roles/role_container_stack/files/windows_amd64/tm-agent.exe"
  register: tm_agent_win_probes
  delegate_to: localhost
  when: ansible_os_family == "Windows"

- name: Resolve tm-agent Windows source binary path
  ansible.builtin.set_fact:
    tm_agent_win_resolved_src: "{{ (tm_agent_win_probes.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"
  when: ansible_os_family == "Windows"

- name: Install tm-agent.exe binary on Windows host
  ansible.windows.win_copy:
    src: "{{ tm_agent_win_resolved_src }}"
    dest: "{{ event_collector_windows_bin_path }}"
  when:
    - ansible_os_family == "Windows"
    - tm_agent_win_resolved_src | default('') | length > 0

- name: Ensure Tomcat Monitoring Agent daemon is running on Windows host
  ansible.windows.win_powershell:
    script: |
      $proc = Get-Process -Name tm-agent -ErrorAction SilentlyContinue
      if (-not $proc) {
          $res = ([wmiclass]'Win32_Process').Create('{{ event_collector_windows_bin_path }} --spool-dir {{ event_collector_windows_spool_dir }}')
          Start-Sleep -Seconds 2
          $proc = Get-Process -Name tm-agent -ErrorAction SilentlyContinue
          if ($proc) {
              $Ansible.Changed = $true
              $Ansible.Result = "Started tm-agent PID $($proc.Id)"
          } else {
              throw "Failed to start tm-agent background process (WMI ReturnValue: $($res.ReturnValue))"
          }
      } else {
          $Ansible.Changed = $false
          $Ansible.Result = "tm-agent already running PID $($proc.Id)"
      }
  when: ansible_os_family == "Windows"

- name: Verify tm-agent daemon status on Windows host
  ansible.windows.win_powershell:
    script: |
      $proc = Get-Process -Name tm-agent -ErrorAction SilentlyContinue
      if ($proc) {
          Write-Output "ACTIVE (PID: $($proc.Id))"
      } else {
          throw "tm-agent daemon is not running"
      }
  when: ansible_os_family == "Windows"
