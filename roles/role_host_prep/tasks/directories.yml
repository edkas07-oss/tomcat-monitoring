---
# Enforce strict permissions and structure for host directories
# Multi-OS Support: Linux & Windows

# ==============================================================================
# Linux Branch (ansible_os_family != "Windows")
# ==============================================================================
- name: Ensure target directory structure exists on Linux host
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ host_prep_spool_dir }}", mode: '0700' }
    - { path: "{{ host_prep_secrets_dir }}", mode: '0700' }
    - { path: "{{ host_prep_tls_dir }}", mode: '0700' }
    - { path: "{{ host_prep_jmx_tls_dir }}", mode: '0700' }
    - { path: "{{ host_prep_systemd_user_dir }}", mode: '0755' }
    - { path: "{{ ansible_env.HOME | default('/home/ansible') }}/.local/bin", mode: '0755' }
    - { path: "{{ project_root }}", mode: '0755' }
  when: ansible_os_family != "Windows"

- name: Synchronize platform configuration to remote Linux host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/{{ item }}"
    dest: "{{ project_root }}/"
    mode: preserve
  loop:
    - CONFIG
    - config
    - scripts
  when:
    - ansible_os_family != "Windows"
    - ansible_connection != 'local' or inventory_hostname != 'localhost'

- name: Ensure synchronized scripts are executable on remote Linux host
  ansible.builtin.file:
    path: "{{ project_root }}/scripts"
    mode: '0755'
    recurse: true
  when:
    - ansible_os_family != "Windows"
    - ansible_connection != 'local' or inventory_hostname != 'localhost'

- name: Probe candidate paths for tmctl Linux binary on control node
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ playbook_dir }}/../tmctl/bin/linux_amd64/tmctl"
    - "{{ playbook_dir }}/bin/linux_amd64/tmctl"
    - "{{ playbook_dir }}/bin/tmctl"
    - "/home/eddywiyatno/git/tmctl/bin/linux_amd64/tmctl"
    - "{{ lookup('env', 'HOME') }}/.local/bin/tmctl"
  register: tmctl_linux_probes
  delegate_to: localhost
  when: ansible_os_family != "Windows"

- name: Resolve tmctl Linux source binary path
  ansible.builtin.set_fact:
    tmctl_resolved_src: "{{ (tmctl_linux_probes.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"
  when: ansible_os_family != "Windows"

- name: Install tmctl operator binary to local user bin on Linux target host
  ansible.builtin.copy:
    src: "{{ tmctl_resolved_src }}"
    dest: "{{ tmctl_bin | default((ansible_env.HOME | default('/home/ansible')) ~ '/.local/bin/tmctl') }}"
    mode: '0755'
  when:
    - ansible_os_family != "Windows"
    - tmctl_resolved_src | default('') | length > 0

# ==============================================================================
# Windows Branch (ansible_os_family == "Windows")
# ==============================================================================
- name: Ensure target directory structure exists on Windows host
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "C:\\monitoring"
    - "C:\\monitoring\\bin"
    - "C:\\monitoring\\spool"
    - "C:\\monitoring\\config"
    - "C:\\monitoring\\secrets"
    - "C:\\monitoring\\tls"
    - "C:\\monitoring\\jmx-tls"
  when: ansible_os_family == "Windows"

- name: Ensure localhost aliases exist in Windows hosts file
  ansible.windows.win_lineinfile:
    path: "C:\\Windows\\System32\\drivers\\etc\\hosts"
    line: "127.0.0.1 mailpit alertmanager prometheus localhost"
    state: present
  when: ansible_os_family == "Windows"

- name: Synchronize platform configuration file to remote Windows host
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/CONFIG"
    dest: "C:\\monitoring\\CONFIG.env"
  when: ansible_os_family == "Windows"

- name: Synchronize platform configuration directories to remote Windows host
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/{{ item }}"
    dest: "C:\\monitoring\\"
  loop:
    - config
    - scripts
  when: ansible_os_family == "Windows"

- name: Probe candidate paths for tmctl Windows binary on control node
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ playbook_dir }}/../tmctl/bin/windows_amd64/tmctl.exe"
    - "{{ playbook_dir }}/bin/windows_amd64/tmctl.exe"
    - "/home/eddywiyatno/git/tmctl/bin/windows_amd64/tmctl.exe"
    - "{{ playbook_dir }}/roles/role_container_stack/files/windows_amd64/tmctl.exe"
  register: tmctl_win_probes
  delegate_to: localhost
  when: ansible_os_family == "Windows"

- name: Resolve tmctl Windows source binary path
  ansible.builtin.set_fact:
    tmctl_win_resolved_src: "{{ (tmctl_win_probes.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"
  when: ansible_os_family == "Windows"

- name: Install tmctl.exe operator binary on Windows host
  ansible.windows.win_copy:
    src: "{{ tmctl_win_resolved_src }}"
    dest: "{{ tmctl_bin | default('C:\\monitoring\\bin\\tmctl.exe') }}"
  when:
    - ansible_os_family == "Windows"
    - tmctl_win_resolved_src | default('') | length > 0
