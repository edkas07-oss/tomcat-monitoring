---
# Ensure Docker NAT network, named volumes, and clean host process state on Windows
# Architecture Reference: TM-ADR-0028, TN-018, TN-019

- name: Check if container engine is available on Windows host
  ansible.windows.win_powershell:
    script: |
      $cmd = Get-Command "{{ host_prep_container_engine | default('docker') }}" -ErrorAction SilentlyContinue
      if ($cmd) {
          $Ansible.Result = $cmd.Source
      } else {
          $Ansible.Result = ""
      }
  register: win_container_engine_check

- name: Fail fast if container engine is missing on Windows host
  ansible.builtin.fail:
    msg: "Container engine '{{ host_prep_container_engine | default('docker') }}' is not installed or not running on Windows host {{ inventory_hostname }}. Platform container deployment requires a working container engine."
  when: (win_container_engine_check.result | default('')) | length == 0

- name: Query container engine operating system mode on Windows host
  ansible.windows.win_powershell:
    script: |
      $info = & {{ host_prep_container_engine | default('docker') }} info --format '{{ '{{' }}.OSType{{ '}}' }}' 2>$null
      if (-not $info) {
          $info = & {{ host_prep_container_engine | default('docker') }} version --format '{{ '{{' }}.Server.Os{{ '}}' }}' 2>$null
      }
      $Ansible.Result = ($info -replace '\s+','').ToLower()
  register: win_docker_ostype_raw
  failed_when: false
  changed_when: false

- name: Resolve Windows container OS mode fact
  ansible.builtin.set_fact:
    resolved_windows_container_os: >-
      {{
        'linux' if (windows_container_mode | default('auto') == 'linux' or ((windows_container_mode | default('auto') == 'auto') and ((win_docker_ostype_raw.result | default('') | trim | lower) == 'linux')))
        else 'windows'
      }}

- name: Display resolved Windows container mode
  ansible.builtin.debug:
    msg: "Windows host {{ inventory_hostname }} container runtime mode resolved to: '{{ resolved_windows_container_os }}' (mode: '{{ windows_container_mode | default('auto') }}', detected OSType: '{{ win_docker_ostype_raw.result | default('unknown') }}')"

- name: Check if container network bridge exists on Windows host
  ansible.windows.win_command: >
    {{ host_prep_container_engine | default('docker') }} network inspect {{ host_prep_network_name | default('monitoring_net') }}
  register: net_check_win
  failed_when: false
  changed_when: false

- name: Create container network bridge on Windows host if missing
  ansible.windows.win_command: >
    {{ host_prep_container_engine | default('docker') }} network create -d {{ 'bridge' if (resolved_windows_container_os == 'linux') else 'nat' }} {{ host_prep_network_name | default('monitoring_net') }}
  when: net_check_win.rc != 0

- name: Check if required named volumes exist on Windows host
  ansible.windows.win_command: >
    {{ host_prep_container_engine | default('docker') }} volume inspect {{ item }}
  loop:
    - prometheus_data
    - alertmanager_data
    - mailpit_data
    - spool_data
    - diagnostic_data
    - tomcat_logs
  register: vol_exists_res_win
  failed_when: false
  changed_when: false

- name: Create missing named volumes on Windows host
  ansible.windows.win_command: >
    {{ host_prep_container_engine | default('docker') }} volume create {{ item.item }}
  loop: "{{ vol_exists_res_win.results | default([]) }}"
  when: item.rc != 0
  changed_when: true

- name: Configure secure NTFS ACLs on Windows named volume directories for non-admin container workloads
  ansible.windows.win_powershell:
    script: |
      $volumes = @('prometheus_data', 'alertmanager_data', 'mailpit_data', 'spool_data', 'diagnostic_data', 'tomcat_logs')
      $changed = $false
      foreach ($vol in $volumes) {
          $path = "C:\ProgramData\docker\volumes\${vol}\_data"
          if (-not (Test-Path $path)) {
              New-Item -ItemType Directory -Force -Path $path | Out-Null
              $changed = $true
          }
          $acl = Get-Acl -Path $path
          $hasUserRule = $false
          foreach ($acc in $acl.Access) {
              if ($acc.IdentityReference.Value -eq "BUILTIN\Users" -and ($acc.FileSystemRights.ToString() -match "Modify|FullControl")) {
                  $hasUserRule = $true
                  break
              }
          }
          if (-not $hasUserRule) {
              $rule = New-Object System.Security.AccessControl.FileSystemAccessRule("BUILTIN\Users", "Modify", "ContainerInherit,ObjectInherit", "None", "Allow")
              $acl.AddAccessRule($rule)
              Set-Acl -Path $path -AclObject $acl
              $changed = $true
          }
      }

      # Also ensure spool and data directories have appropriate ACL for container bind mounts
      $hostPaths = @("{{ project_root }}\spool", "{{ project_root }}\data")
      foreach ($hp in $hostPaths) {
          if (Test-Path $hp) {
              $acl = Get-Acl -Path $hp
              $hasUserRule = $false
              foreach ($acc in $acl.Access) {
                  if ($acc.IdentityReference.Value -eq "BUILTIN\Users" -and ($acc.FileSystemRights.ToString() -match "Modify|FullControl")) {
                      $hasUserRule = $true
                      break
                  }
              }
              if (-not $hasUserRule) {
                  $rule = New-Object System.Security.AccessControl.FileSystemAccessRule("BUILTIN\Users", "Modify", "ContainerInherit,ObjectInherit", "None", "Allow")
                  $acl.AddAccessRule($rule)
                  Set-Acl -Path $hp -AclObject $acl
                  $changed = $true
              }
          }
      }

      $Ansible.Changed = $changed
      $Ansible.Result = "Configured least-privilege NTFS ACLs for non-admin container workloads."
  when: resolved_windows_container_os == "windows"

- name: Terminate legacy native background .exe processes if running on Windows host
  ansible.windows.win_powershell:
    script: |
      $procs = Get-Process prometheus, alertmanager, mailpit, tm-agent -ErrorAction SilentlyContinue
      if ($procs) {
          $stopped = @()
          foreach ($p in $procs) {
              $name = $p.ProcessName
              $id = $p.Id
              Stop-Process -Id $id -Force -ErrorAction SilentlyContinue
              $stopped += "$name (PID: $id)"
          }
          $Ansible.Changed = $true
          $Ansible.Result = "Terminated legacy host processes: $($stopped -join ', ')"
      } else {
          $Ansible.Changed = $false
          $Ansible.Result = "No legacy host processes running."
      }
