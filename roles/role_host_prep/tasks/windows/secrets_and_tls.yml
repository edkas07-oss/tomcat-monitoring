---
# Initialize secret material and TLS certificates on Windows host
# Architecture Reference: TM-ADR-0028, TN-018, TN-019

- name: Check existence of diagnostic bearer token on Windows host
  ansible.windows.win_stat:
    path: "{{ host_prep_secrets_dir }}\\bearer-token"
  register: stat_bearer_token_win

- name: Initialize diagnostic bearer token on Windows host
  ansible.windows.win_copy:
    content: "{{ host_prep_default_bearer_token }}\r\n"
    dest: "{{ host_prep_secrets_dir }}\\bearer-token"
  when: not stat_bearer_token_win.stat.exists

- name: Check existence of SMTP username secret on Windows host
  ansible.windows.win_stat:
    path: "{{ host_prep_secrets_dir }}\\smtp-username"
  register: stat_smtp_user_win

- name: Initialize SMTP username secret on Windows host
  ansible.windows.win_copy:
    content: "{{ host_prep_default_smtp_user }}\r\n"
    dest: "{{ host_prep_secrets_dir }}\\smtp-username"
  when: not stat_smtp_user_win.stat.exists

- name: Check existence of SMTP password secret on Windows host
  ansible.windows.win_stat:
    path: "{{ host_prep_secrets_dir }}\\smtp-password"
  register: stat_smtp_pass_win

- name: Initialize SMTP password secret on Windows host
  ansible.windows.win_copy:
    content: "{{ host_prep_default_smtp_pass }}\r\n"
    dest: "{{ host_prep_secrets_dir }}\\smtp-password"
  when: not stat_smtp_pass_win.stat.exists

- name: Check existence of JMX Exporter keystore password on Windows host
  ansible.windows.win_stat:
    path: "{{ host_prep_jmx_tls_dir }}\\keystore-password"
  register: stat_jmx_pass_win

- name: Initialize JMX Exporter keystore password on Windows host
  ansible.windows.win_copy:
    content: "changeit\r\n"
    dest: "{{ host_prep_jmx_tls_dir }}\\keystore-password"
  when: not stat_jmx_pass_win.stat.exists

- name: Check existence of Diagnostic Service TLS certificate on Windows host
  ansible.windows.win_stat:
    path: "{{ host_prep_tls_dir }}\\server.crt"
  register: win_stat_ds_tls_crt

- name: Create local temporary directory for Windows TLS material on controller
  ansible.builtin.file:
    path: "/tmp/tm_tls_{{ inventory_hostname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  when: not win_stat_ds_tls_crt.stat.exists

- name: Generate Diagnostic Service TLS certificate on controller for Windows host
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 365
    -subj '/CN=diagnostic-service'
    -addext 'subjectAltName=DNS:diagnostic-service'
    -keyout "/tmp/tm_tls_{{ inventory_hostname }}/server.key"
    -out "/tmp/tm_tls_{{ inventory_hostname }}/server.crt"
  delegate_to: localhost
  when: not win_stat_ds_tls_crt.stat.exists

- name: Generate JMX Exporter TLS certificate and keystore on controller for Windows host
  ansible.builtin.shell: |
    openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
      -subj '/CN=tomcat-jmx-exporter' \
      -addext 'subjectAltName=DNS:tomcat-jmx-exporter' \
      -keyout "/tmp/tm_tls_{{ inventory_hostname }}/jmx_server.key" \
      -out "/tmp/tm_tls_{{ inventory_hostname }}/jmx_server.crt"
    openssl pkcs12 -export \
      -inkey "/tmp/tm_tls_{{ inventory_hostname }}/jmx_server.key" \
      -in "/tmp/tm_tls_{{ inventory_hostname }}/jmx_server.crt" \
      -out "/tmp/tm_tls_{{ inventory_hostname }}/keystore.p12" \
      -passout pass:changeit
  delegate_to: localhost
  when: not win_stat_ds_tls_crt.stat.exists

- name: Copy Diagnostic Service TLS certificate and key to Windows host
  ansible.windows.win_copy:
    src: "/tmp/tm_tls_{{ inventory_hostname }}/{{ item }}"
    dest: "{{ host_prep_tls_dir }}\\{{ item }}"
  loop:
    - server.crt
    - server.key
  when: not win_stat_ds_tls_crt.stat.exists

- name: Copy JMX Exporter TLS material to Windows host
  ansible.windows.win_copy:
    src: "/tmp/tm_tls_{{ inventory_hostname }}/{{ item.src }}"
    dest: "{{ host_prep_jmx_tls_dir }}\\{{ item.dest }}"
  loop:
    - { src: "jmx_server.crt", dest: "server.crt" }
    - { src: "jmx_server.key", dest: "server.key" }
    - { src: "keystore.p12", dest: "keystore.p12" }
  when: not win_stat_ds_tls_crt.stat.exists

- name: Cleanup local temporary TLS directory on controller
  ansible.builtin.file:
    path: "/tmp/tm_tls_{{ inventory_hostname }}"
    state: absent
  delegate_to: localhost
  when: not win_stat_ds_tls_crt.stat.exists

- name: Ensure Alertmanager secrets directory exists on Windows host
  ansible.windows.win_file:
    path: "C:\\monitoring\\config\\alertmanager\\run\\secrets\\tomcat-monitoring"
    state: directory

- name: Materialize Alertmanager webhook URL and bearer token on Windows host
  ansible.windows.win_copy:
    content: "{{ item.content }}"
    dest: "C:\\monitoring\\config\\alertmanager\\run\\secrets\\tomcat-monitoring\\{{ item.name }}"
  loop:
    - { name: "diagnostic-service-webhook-url", content: "https://diagnostic-service:8443/api/v1/alerts/alertmanager\r\n" }
    - { name: "diagnostic-service-bearer-token", content: "{{ host_prep_default_bearer_token }}\r\n" }

- name: Materialize Alertmanager CA certificate on Windows host
  ansible.windows.win_copy:
    src: "{{ host_prep_tls_dir }}\\server.crt"
    dest: "C:\\monitoring\\config\\alertmanager\\run\\secrets\\tomcat-monitoring\\diagnostic-service-ca.crt"
    remote_src: true

- name: Ensure Prometheus secrets directory exists on Windows host
  ansible.windows.win_file:
    path: "C:\\monitoring\\config\\prometheus\\run\\secrets\\tomcat-monitoring"
    state: directory

- name: Materialize Prometheus CA certificates on Windows host
  ansible.windows.win_copy:
    src: "{{ item.src }}"
    dest: "C:\\monitoring\\config\\prometheus\\run\\secrets\\tomcat-monitoring\\{{ item.dest }}"
    remote_src: true
  loop:
    - { src: "{{ host_prep_jmx_tls_dir }}\\server.crt", dest: "jmx-exporter-ca.crt" }
    - { src: "{{ host_prep_tls_dir }}\\server.crt", dest: "diagnostic-service-ca.crt" }
