---
# Initialize secret material and TLS certificates with strict least-privilege permissions
# Multi-OS Support: Linux & Windows

# ==============================================================================
# 1. Secret Materials (Bearer Token, SMTP Credentials, Keystore Password)
# ==============================================================================
- name: Check existence of diagnostic bearer token
  ansible.builtin.stat:
    path: "{{ host_prep_secrets_dir }}/bearer-token"
  register: stat_bearer_token

- name: Initialize diagnostic bearer token on Linux host
  ansible.builtin.copy:
    content: "{{ host_prep_default_bearer_token }}\n"
    dest: "{{ host_prep_secrets_dir }}/bearer-token"
    mode: '0400'
  when:
    - ansible_os_family != "Windows"
    - not stat_bearer_token.stat.exists

- name: Initialize diagnostic bearer token on Windows host
  ansible.windows.win_copy:
    content: "{{ host_prep_default_bearer_token }}\r\n"
    dest: "{{ host_prep_secrets_dir }}\\bearer-token"
  when:
    - ansible_os_family == "Windows"
    - not stat_bearer_token.stat.exists

- name: Check existence of SMTP username secret
  ansible.builtin.stat:
    path: "{{ host_prep_secrets_dir }}/smtp-username"
  register: stat_smtp_user

- name: Initialize SMTP username secret on Linux host
  ansible.builtin.copy:
    content: "{{ host_prep_default_smtp_user }}\n"
    dest: "{{ host_prep_secrets_dir }}/smtp-username"
    mode: '0400'
  when:
    - ansible_os_family != "Windows"
    - not stat_smtp_user.stat.exists

- name: Initialize SMTP username secret on Windows host
  ansible.windows.win_copy:
    content: "{{ host_prep_default_smtp_user }}\r\n"
    dest: "{{ host_prep_secrets_dir }}\\smtp-username"
  when:
    - ansible_os_family == "Windows"
    - not stat_smtp_user.stat.exists

- name: Check existence of SMTP password secret
  ansible.builtin.stat:
    path: "{{ host_prep_secrets_dir }}/smtp-password"
  register: stat_smtp_pass

- name: Initialize SMTP password secret on Linux host
  ansible.builtin.copy:
    content: "{{ host_prep_default_smtp_pass }}\n"
    dest: "{{ host_prep_secrets_dir }}/smtp-password"
    mode: '0400'
  when:
    - ansible_os_family != "Windows"
    - not stat_smtp_pass.stat.exists

- name: Initialize SMTP password secret on Windows host
  ansible.windows.win_copy:
    content: "{{ host_prep_default_smtp_pass }}\r\n"
    dest: "{{ host_prep_secrets_dir }}\\smtp-password"
  when:
    - ansible_os_family == "Windows"
    - not stat_smtp_pass.stat.exists

- name: Check existence of JMX Exporter keystore and password
  ansible.builtin.stat:
    path: "{{ host_prep_jmx_tls_dir }}/keystore.p12"
  register: stat_jmx_keystore

- name: Initialize JMX Exporter keystore password on Linux host
  ansible.builtin.copy:
    content: "changeit\n"
    dest: "{{ host_prep_jmx_tls_dir }}/keystore-password"
    mode: '0400'
  when:
    - ansible_os_family != "Windows"
    - not stat_jmx_keystore.stat.exists

- name: Initialize JMX Exporter keystore password on Windows host
  ansible.windows.win_copy:
    content: "changeit\r\n"
    dest: "{{ host_prep_jmx_tls_dir }}\\keystore-password"
  when:
    - ansible_os_family == "Windows"
    - not stat_jmx_keystore.stat.exists

# ==============================================================================
# 2. Linux TLS Certificate Generation
# ==============================================================================
- name: Check existence of Diagnostic Service TLS certificate and key (Linux)
  ansible.builtin.stat:
    path: "{{ host_prep_tls_dir }}/server.crt"
  register: stat_ds_tls_crt
  when: ansible_os_family != "Windows"

- name: Generate self-signed TLS certificate and key for Diagnostic Service (Linux)
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 365
    -subj '/CN=diagnostic-service'
    -addext 'subjectAltName=DNS:diagnostic-service'
    -keyout "{{ host_prep_tls_dir }}/server.key"
    -out "{{ host_prep_tls_dir }}/server.crt"
  when:
    - ansible_os_family != "Windows"
    - not stat_ds_tls_crt.stat.exists

- name: Ensure strict permissions on Diagnostic Service TLS key (0400) and certificate (0444) on Linux
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ host_prep_tls_dir }}/server.key", mode: '0400' }
    - { path: "{{ host_prep_tls_dir }}/server.crt", mode: '0444' }
  when: ansible_os_family != "Windows"
  ignore_errors: true

- name: Generate self-signed TLS certificate and key for JMX Exporter (Linux)
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 365
    -subj '/CN=tomcat-jmx-exporter'
    -addext 'subjectAltName=DNS:tomcat-jmx-exporter'
    -keyout "{{ host_prep_jmx_tls_dir }}/server.key"
    -out "{{ host_prep_jmx_tls_dir }}/server.crt"
  when:
    - ansible_os_family != "Windows"
    - not stat_jmx_keystore.stat.exists

- name: Generate PKCS12 keystore for JMX Exporter (Linux)
  ansible.builtin.command: >
    openssl pkcs12 -export
    -inkey "{{ host_prep_jmx_tls_dir }}/server.key"
    -in "{{ host_prep_jmx_tls_dir }}/server.crt"
    -out "{{ host_prep_jmx_tls_dir }}/keystore.p12"
    -passout pass:changeit
  when:
    - ansible_os_family != "Windows"
    - not stat_jmx_keystore.stat.exists

- name: Check existence of Postfix CA certificate (Linux)
  ansible.builtin.stat:
    path: "{{ host_prep_tls_dir }}/postfix-ca.crt"
  register: stat_postfix_ca
  when: ansible_os_family != "Windows"

- name: Initialize placeholder Postfix CA certificate file if missing (Linux)
  ansible.builtin.file:
    path: "{{ host_prep_tls_dir }}/postfix-ca.crt"
    state: touch
    mode: '0644'
  when:
    - ansible_os_family != "Windows"
    - not stat_postfix_ca.stat.exists

# ==============================================================================
# 3. Windows TLS Certificate Generation & Synchronization
# ==============================================================================
- name: Check existence of Diagnostic Service TLS certificate on Windows host
  ansible.builtin.stat:
    path: "{{ host_prep_tls_dir }}/server.crt"
  register: win_stat_ds_tls_crt
  when: ansible_os_family == "Windows"

- name: Create local temporary directory for Windows TLS material on controller
  ansible.builtin.file:
    path: "/tmp/tm_tls_{{ inventory_hostname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  when:
    - ansible_os_family == "Windows"
    - not win_stat_ds_tls_crt.stat.exists

- name: Generate Diagnostic Service TLS certificate on controller for Windows host
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 365
    -subj '/CN=diagnostic-service'
    -addext 'subjectAltName=DNS:diagnostic-service'
    -keyout "/tmp/tm_tls_{{ inventory_hostname }}/server.key"
    -out "/tmp/tm_tls_{{ inventory_hostname }}/server.crt"
  delegate_to: localhost
  when:
    - ansible_os_family == "Windows"
    - not win_stat_ds_tls_crt.stat.exists

- name: Generate JMX Exporter TLS certificate and keystore on controller for Windows host
  ansible.builtin.shell: |
    openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
      -subj '/CN=tomcat-jmx-exporter' \
      -addext 'subjectAltName=DNS:tomcat-jmx-exporter' \
      -keyout "/tmp/tm_tls_{{ inventory_hostname }}/jmx_server.key" \
      -out "/tmp/tm_tls_{{ inventory_hostname }}/jmx_server.crt"
    openssl pkcs12 -export \
      -inkey "/tmp/tm_tls_{{ inventory_hostname }}/jmx_server.key" \
      -in "/tmp/tm_tls_{{ inventory_hostname }}/jmx_server.crt" \
      -out "/tmp/tm_tls_{{ inventory_hostname }}/keystore.p12" \
      -passout pass:changeit
  delegate_to: localhost
  when:
    - ansible_os_family == "Windows"
    - not win_stat_ds_tls_crt.stat.exists

- name: Copy Diagnostic Service TLS certificate and key to Windows host
  ansible.windows.win_copy:
    src: "/tmp/tm_tls_{{ inventory_hostname }}/{{ item }}"
    dest: "{{ host_prep_tls_dir }}\\{{ item }}"
  loop:
    - server.crt
    - server.key
  when:
    - ansible_os_family == "Windows"
    - not win_stat_ds_tls_crt.stat.exists

- name: Copy JMX Exporter TLS material to Windows host
  ansible.windows.win_copy:
    src: "/tmp/tm_tls_{{ inventory_hostname }}/{{ item.src }}"
    dest: "{{ host_prep_jmx_tls_dir }}\\{{ item.dest }}"
  loop:
    - { src: "jmx_server.crt", dest: "server.crt" }
    - { src: "jmx_server.key", dest: "server.key" }
    - { src: "keystore.p12", dest: "keystore.p12" }
  when:
    - ansible_os_family == "Windows"
    - not win_stat_ds_tls_crt.stat.exists

- name: Cleanup local temporary TLS directory on controller
  ansible.builtin.file:
    path: "/tmp/tm_tls_{{ inventory_hostname }}"
    state: absent
  delegate_to: localhost
  when:
    - ansible_os_family == "Windows"
    - not win_stat_ds_tls_crt.stat.exists
