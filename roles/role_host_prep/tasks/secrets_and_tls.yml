---
# Initialize secret material and TLS certificates with strict least-privilege permissions

- name: Check existence of diagnostic bearer token
  ansible.builtin.stat:
    path: "{{ host_prep_secrets_dir }}/bearer-token"
  register: stat_bearer_token

- name: Initialize diagnostic bearer token with strict 0400 permission
  ansible.builtin.copy:
    content: "{{ host_prep_default_bearer_token }}\n"
    dest: "{{ host_prep_secrets_dir }}/bearer-token"
    mode: '0400'
  when: not stat_bearer_token.stat.exists

- name: Check existence of SMTP username secret
  ansible.builtin.stat:
    path: "{{ host_prep_secrets_dir }}/smtp-username"
  register: stat_smtp_user

- name: Initialize SMTP username secret with strict 0400 permission
  ansible.builtin.copy:
    content: "{{ host_prep_default_smtp_user }}\n"
    dest: "{{ host_prep_secrets_dir }}/smtp-username"
    mode: '0400'
  when: not stat_smtp_user.stat.exists

- name: Check existence of SMTP password secret
  ansible.builtin.stat:
    path: "{{ host_prep_secrets_dir }}/smtp-password"
  register: stat_smtp_pass

- name: Initialize SMTP password secret with strict 0400 permission
  ansible.builtin.copy:
    content: "{{ host_prep_default_smtp_pass }}\n"
    dest: "{{ host_prep_secrets_dir }}/smtp-password"
    mode: '0400'
  when: not stat_smtp_pass.stat.exists

- name: Check existence of Diagnostic Service TLS certificate and key
  ansible.builtin.stat:
    path: "{{ host_prep_tls_dir }}/server.crt"
  register: stat_ds_tls_crt

- name: Generate self-signed TLS certificate and key for Diagnostic Service if missing
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 365
    -subj '/CN=diagnostic-service'
    -addext 'subjectAltName=DNS:diagnostic-service'
    -keyout "{{ host_prep_tls_dir }}/server.key"
    -out "{{ host_prep_tls_dir }}/server.crt"
  when: not stat_ds_tls_crt.stat.exists

- name: Ensure strict permissions on Diagnostic Service TLS key (0400) and certificate (0444)
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ host_prep_tls_dir }}/server.key", mode: '0400' }
    - { path: "{{ host_prep_tls_dir }}/server.crt", mode: '0444' }
  ignore_errors: true

- name: Check existence of JMX Exporter keystore and password
  ansible.builtin.stat:
    path: "{{ host_prep_jmx_tls_dir }}/keystore.p12"
  register: stat_jmx_keystore

- name: Initialize JMX Exporter keystore password if missing
  ansible.builtin.copy:
    content: "changeit\n"
    dest: "{{ host_prep_jmx_tls_dir }}/keystore-password"
    mode: '0400'
  when: not stat_jmx_keystore.stat.exists

- name: Copy Postfix CA certificate for Diagnostic Service TLS verification if container running
  ansible.builtin.shell: >
    {{ host_prep_container_engine }} cp postfix-relay:/etc/postfix/tls/server.crt "{{ host_prep_tls_dir }}/postfix-ca.crt" 2>/dev/null || true
  changed_when: false
