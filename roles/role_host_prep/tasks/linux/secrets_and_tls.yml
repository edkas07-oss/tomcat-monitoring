---
# Initialize secret material and TLS certificates with strict least-privilege permissions on Linux
# Architecture Reference: TM-ADR-0025, TN-014, TN-019

- name: Check existence of diagnostic bearer token on Linux host
  ansible.builtin.stat:
    path: "{{ host_prep_secrets_dir }}/bearer-token"
  register: stat_bearer_token_linux

- name: Initialize diagnostic bearer token on Linux host
  ansible.builtin.copy:
    content: "{{ host_prep_default_bearer_token }}\n"
    dest: "{{ host_prep_secrets_dir }}/bearer-token"
    mode: '0400'
  when: not stat_bearer_token_linux.stat.exists

- name: Check existence of SMTP username secret on Linux host
  ansible.builtin.stat:
    path: "{{ host_prep_secrets_dir }}/smtp-username"
  register: stat_smtp_user_linux

- name: Initialize SMTP username secret on Linux host
  ansible.builtin.copy:
    content: "{{ host_prep_default_smtp_user }}\n"
    dest: "{{ host_prep_secrets_dir }}/smtp-username"
    mode: '0400'
  when: not stat_smtp_user_linux.stat.exists

- name: Check existence of SMTP password secret on Linux host
  ansible.builtin.stat:
    path: "{{ host_prep_secrets_dir }}/smtp-password"
  register: stat_smtp_pass_linux

- name: Initialize SMTP password secret on Linux host
  ansible.builtin.copy:
    content: "{{ host_prep_default_smtp_pass }}\n"
    dest: "{{ host_prep_secrets_dir }}/smtp-password"
    mode: '0400'
  when: not stat_smtp_pass_linux.stat.exists

- name: Check existence of JMX Exporter keystore on Linux host
  ansible.builtin.stat:
    path: "{{ host_prep_jmx_tls_dir }}/keystore.p12"
  register: stat_jmx_keystore_linux

- name: Initialize JMX Exporter keystore password on Linux host
  ansible.builtin.copy:
    content: "changeit\n"
    dest: "{{ host_prep_jmx_tls_dir }}/keystore-password"
    mode: '0400'
  when: not stat_jmx_keystore_linux.stat.exists

# ------------------------------------------------------------------------------
# TLS Certificate Lifecycle Governance (Auto-Renewal & Custom SSL)
# ------------------------------------------------------------------------------

# Case A: Custom TLS Certificate Mode
- name: Deploy custom Diagnostic Service TLS certificate and key (Linux)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ host_prep_tls_dir }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ custom_tls_cert_path }}", dest: "server.crt", mode: '0444' }
    - { src: "{{ custom_tls_key_path }}", dest: "server.key", mode: '0400' }
  when:
    - tls_mode | default('auto') == 'custom'
    - custom_tls_cert_path | default('') | length > 0
    - custom_tls_key_path | default('') | length > 0

- name: Deploy custom JMX Exporter TLS certificate and key (Linux)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ host_prep_jmx_tls_dir }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ custom_jmx_tls_cert_path }}", dest: "server.crt", mode: '0444' }
    - { src: "{{ custom_jmx_tls_key_path }}", dest: "server.key", mode: '0400' }
  when:
    - tls_mode | default('auto') == 'custom'
    - custom_jmx_tls_cert_path | default('') | length > 0
    - custom_jmx_tls_key_path | default('') | length > 0

# Case B: Automated Lifecycle Mode (Self-Signed with Auto-Renewal)
- name: Check validity and expiration of existing TLS certificate (Linux)
  ansible.builtin.shell: |
    if [ -f "{{ host_prep_tls_dir }}/server.crt" ]; then
      if openssl x509 -checkend $(( {{ tls_renew_threshold_days | default(30) }} * 86400 )) -noout -in "{{ host_prep_tls_dir }}/server.crt" >/dev/null 2>&1; then
        echo "VALID"
      else
        echo "RENEW_REQUIRED"
      fi
    else
      echo "MISSING"
    fi
  register: linux_tls_status_res
  changed_when: false
  when: tls_mode | default('auto') == 'auto'

- name: Determine if TLS certificate generation or renewal is required (Linux)
  ansible.builtin.set_fact:
    linux_tls_renewal_needed: >-
      {{
        (tls_mode | default('auto') == 'auto') and
        (linux_tls_status_res.stdout | default('') | trim != 'VALID')
      }}

- name: Generate self-signed TLS certificate and key for Diagnostic Service (Linux)
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 365
    -subj '/CN=diagnostic-service'
    -addext 'subjectAltName=DNS:diagnostic-service'
    -keyout "{{ host_prep_tls_dir }}/server.key"
    -out "{{ host_prep_tls_dir }}/server.crt"
  when: linux_tls_renewal_needed | default(false)

- name: Ensure strict permissions on Diagnostic Service TLS key (0400) and certificate (0444) on Linux
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ host_prep_tls_dir }}/server.key", mode: '0400' }
    - { path: "{{ host_prep_tls_dir }}/server.crt", mode: '0444' }
  when: linux_tls_renewal_needed | default(false)

- name: Generate self-signed TLS certificate and key for JMX Exporter (Linux)
  ansible.builtin.command: >
    openssl req -x509 -newkey rsa:2048 -nodes -days 365
    -subj '/CN=tomcat-jmx-exporter'
    -addext 'subjectAltName=DNS:tomcat-jmx-exporter'
    -keyout "{{ host_prep_jmx_tls_dir }}/server.key"
    -out "{{ host_prep_jmx_tls_dir }}/server.crt"
  when: linux_tls_renewal_needed | default(false)

- name: Generate PKCS12 keystore for JMX Exporter (Linux)
  ansible.builtin.command: >
    openssl pkcs12 -export
    -inkey "{{ host_prep_jmx_tls_dir }}/server.key"
    -in "{{ host_prep_jmx_tls_dir }}/server.crt"
    -out "{{ host_prep_jmx_tls_dir }}/keystore.p12"
    -passout pass:changeit
  when: linux_tls_renewal_needed | default(false)


- name: Check existence of Postfix CA certificate (Linux)
  ansible.builtin.stat:
    path: "{{ host_prep_tls_dir }}/postfix-ca.crt"
  register: stat_postfix_ca_linux

- name: Initialize placeholder Postfix CA certificate file if missing (Linux)
  ansible.builtin.file:
    path: "{{ host_prep_tls_dir }}/postfix-ca.crt"
    state: touch
    mode: '0644'
  when: not stat_postfix_ca_linux.stat.exists
