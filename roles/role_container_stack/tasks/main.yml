---
# Main entrypoint for role_container_stack
# Architecture Reference: TM-ADR-0025, TM-ADR-0026, TN-014, TN-018

# ==============================================================================
# Container Engine Verification (Fail Fast)
# ==============================================================================
- name: Verify container engine availability on Windows host
  ansible.windows.win_powershell:
    script: |
      $cmd = Get-Command "{{ stack_container_engine }}" -ErrorAction SilentlyContinue
      if ($cmd) {
          $Ansible.Result = $cmd.Source
      } else {
          $Ansible.Result = ""
      }
  register: win_container_engine_stack_check
  when: ansible_os_family == "Windows"

- name: Assert container engine is ready on Windows host
  ansible.builtin.fail:
    msg: "Container engine '{{ stack_container_engine }}' is not detected or not running on Windows host {{ inventory_hostname }}. All container stack components (Prometheus, Alertmanager, Tomcat, Mailpit, Diagnostic Service) require a running container runtime."
  when:
    - ansible_os_family == "Windows"
    - (win_container_engine_stack_check.result | default('')) | length == 0

# ==============================================================================
# Container Workloads Execution
# ==============================================================================
- name: Reconcile and pull container images on host
  ansible.builtin.import_tasks: pull_images.yml

- name: Deploy Mailpit local SMTP receiver on host
  ansible.builtin.import_tasks: mailpit.yml

- name: Deploy Postfix Enterprise SMTP Relay on host
  ansible.builtin.import_tasks: postfix.yml

- name: Deploy Tomcat JMX Exporter workload on host
  ansible.builtin.import_tasks: tomcat.yml

- name: Deploy Prometheus TSDB and alert engine on host
  ansible.builtin.import_tasks: prometheus.yml

- name: Deploy Alertmanager alert routing hub on host
  ansible.builtin.import_tasks: alertmanager.yml

- name: Deploy Tomcat Diagnostic Service analytics engine on host
  ansible.builtin.import_tasks: diagnostic_service.yml

# ==============================================================================
# Post-Deployment 100% Verification
# ==============================================================================
- name: Verify end-to-end stack readiness on host (100% components UP)
  ansible.builtin.import_tasks: verify_readiness.yml
