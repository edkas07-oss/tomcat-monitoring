---
# Deploy and ensure desired state for Mailpit container via tmctl
# Multi-OS Support: Linux & Windows

# ==============================================================================
# Linux Branch (ansible_os_family != "Windows")
# ==============================================================================
- name: Check if Mailpit container is running on Linux host
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_mailpit_container }}
  register: mailpit_status_linux
  failed_when: false
  changed_when: false
  when: ansible_os_family != "Windows"

- name: Deploy Mailpit container via tmctl on Linux host if not running
  ansible.builtin.command: >
    {{ stack_tmctl_bin }} stack deploy --target mailpit --env {{ stack_deploy_env }} --config {{ stack_project_root }}/CONFIG
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when:
    - ansible_os_family != "Windows"
    - (mailpit_status_linux.stdout | default('') | trim) != "running"


