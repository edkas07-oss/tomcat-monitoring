---
# Deploy and ensure desired state for Mailpit container via tmctl
# Multi-OS Support: Linux & Windows

# ==============================================================================
# Linux Branch (ansible_os_family != "Windows")
# ==============================================================================
- name: Check if Mailpit container is running on Linux host
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_mailpit_container }}
  register: mailpit_status_linux
  failed_when: false
  changed_when: false
  when: ansible_os_family != "Windows"

- name: Deploy Mailpit container via tmctl on Linux host if not running
  ansible.builtin.command: >
    {{ stack_tmctl_bin }} stack deploy --target mailpit --env {{ stack_deploy_env }} --config {{ stack_project_root }}/CONFIG
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when:
    - ansible_os_family != "Windows"
    - (mailpit_status_linux.stdout | default('') | trim) != "running"

# ==============================================================================
# Windows Branch (ansible_os_family == "Windows")
# ==============================================================================
- name: Ensure Mailpit data directory exists on Windows host
  ansible.windows.win_file:
    path: "C:\\monitoring\\data\\mailpit"
    state: directory
  when: ansible_os_family == "Windows"

- name: Ensure Mailpit background process is running on Windows host
  ansible.windows.win_powershell:
    script: |
      $proc = Get-Process -Name mailpit -ErrorAction SilentlyContinue
      if (-not $proc) {
          $p = Start-Process -FilePath 'C:\monitoring\bin\mailpit.exe' -ArgumentList '--listen=0.0.0.0:8025 --smtp=0.0.0.0:1025 --db-file=C:\monitoring\data\mailpit\mailpit.db' -PassThru
          Start-Sleep -Seconds 2
          $proc = Get-Process -Name mailpit -ErrorAction SilentlyContinue
          if ($proc) {
              $Ansible.Changed = $true
              $Ansible.Result = "Started mailpit PID $($proc.Id)"
          } else {
              throw "Failed to start mailpit process"
          }
      } else {
          $Ansible.Changed = $false
          $Ansible.Result = "mailpit already running PID $($proc.Id)"
      }
  when: ansible_os_family == "Windows"


