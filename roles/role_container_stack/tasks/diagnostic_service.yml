---
# Deploy and ensure desired state for Tomcat Diagnostic Service container

- name: Check if Diagnostic Service container is running
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_diagnostic_container }}
  register: diagnostic_status
  failed_when: false
  changed_when: false

- name: Deploy Diagnostic Service container via deploy script
  ansible.builtin.shell: >
    bash {{ stack_project_root }}/scripts/deploy-diagnostic-service.sh
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when: diagnostic_status.stdout != "running"
