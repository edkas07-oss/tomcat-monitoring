---
# Deploy and ensure desired state for Tomcat Diagnostic Service container via tmctl
# Architecture Reference: TM-ADR-0027 (TN-014)

- name: Check if Diagnostic Service container is running
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_diagnostic_container }}
  register: diagnostic_status
  failed_when: false
  changed_when: false

- name: Deploy Diagnostic Service container via tmctl if not running
  ansible.builtin.command: >
    {{ stack_tmctl_bin }} stack deploy --target diagnostic --env {{ stack_deploy_env }} --config {{ stack_project_root }}/CONFIG
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when: diagnostic_status.stdout != "running"
