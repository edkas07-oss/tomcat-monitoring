---
# Deploy and ensure desired state for Tomcat JMX Exporter container via tmctl
# Architecture Reference: TM-ADR-0027 (TN-014)

- name: Check if Tomcat JMX Exporter container is running
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_tomcat_container }}
  register: tomcat_status
  failed_when: false
  changed_when: false

- name: Deploy Tomcat JMX Exporter via tmctl if not running
  ansible.builtin.command: >
    {{ stack_tmctl_bin }} stack deploy --target tomcat --env {{ stack_deploy_env }} --config {{ stack_project_root }}/CONFIG
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when: tomcat_status.stdout != "running"
