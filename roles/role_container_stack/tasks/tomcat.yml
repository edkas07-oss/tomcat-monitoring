---
# Deploy and ensure desired state for Tomcat JMX Exporter container

- name: Check if Tomcat JMX Exporter container is running
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_tomcat_container }}
  register: tomcat_status
  failed_when: false
  changed_when: false

- name: Deploy Tomcat JMX Exporter via deploy script if not running or update required
  ansible.builtin.shell: >
    bash {{ stack_project_root }}/scripts/deploy-tomcat.sh
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when: tomcat_status.stdout != "running"
