---
# Deploy and ensure desired state for Alertmanager container via tmctl
# Multi-OS Support: Linux & Windows

# ==============================================================================
# Linux Branch (ansible_os_family != "Windows")
# ==============================================================================
- name: Check if Alertmanager container is running on Linux host
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_alertmanager_container }}
  register: alertmanager_status_linux
  failed_when: false
  changed_when: false
  when: ansible_os_family != "Windows"

- name: Deploy Alertmanager container via tmctl on Linux host if not running
  ansible.builtin.command: >
    {{ stack_tmctl_bin }} stack deploy --target alertmanager --env {{ stack_deploy_env }} --config {{ stack_project_root }}/CONFIG
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when:
    - ansible_os_family != "Windows"
    - (alertmanager_status_linux.stdout | default('') | trim) != "running"

# ==============================================================================
# Windows Branch (ansible_os_family == "Windows")
# ==============================================================================
- name: Ensure Alertmanager data directory exists on Windows host
  ansible.windows.win_file:
    path: "C:\\monitoring\\data\\alertmanager"
    state: directory
  when: ansible_os_family == "Windows"

- name: Ensure Alertmanager background process is running on Windows host
  ansible.windows.win_powershell:
    script: |
      $proc = Get-Process -Name alertmanager -ErrorAction SilentlyContinue
      if (-not $proc) {
          $p = Start-Process -FilePath 'C:\monitoring\bin\alertmanager.exe' -ArgumentList '--config.file=C:\monitoring\config\alertmanager\alertmanager.yml --storage.path=C:\monitoring\data\alertmanager --web.listen-address=0.0.0.0:9093' -PassThru
          Start-Sleep -Seconds 2
          $proc = Get-Process -Name alertmanager -ErrorAction SilentlyContinue
          if ($proc) {
              $Ansible.Changed = $true
              $Ansible.Result = "Started alertmanager PID $($proc.Id)"
          } else {
              throw "Failed to start alertmanager process"
          }
      } else {
          $Ansible.Changed = $false
          $Ansible.Result = "alertmanager already running PID $($proc.Id)"
      }
  when: ansible_os_family == "Windows"


