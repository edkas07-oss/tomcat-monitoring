---
# Deploy and ensure desired state for Postfix Enterprise SMTP Relay container via tmctl
# Architecture Reference: TM-ADR-0027 (TN-014)

- name: Check if Postfix container is running
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_postfix_container }}
  register: postfix_status
  failed_when: false
  changed_when: false

- name: Deploy Postfix Relay container via tmctl if not running
  ansible.builtin.command: >
    {{ stack_tmctl_bin }} stack deploy --target postfix --env {{ stack_deploy_env }} --config {{ stack_project_root }}/CONFIG
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when: postfix_status.stdout != "running"
  ignore_errors: true

- name: Ensure Postfix TLS certificate is synced for Diagnostic Service
  ansible.builtin.command: >
    {{ stack_container_engine }} cp {{ stack_postfix_container }}:/etc/postfix/tls/server.crt {{ default_tls_dir | default(lookup('ansible.builtin.env', 'HOME') ~ '/.local/share/tomcat-monitoring/diagnostic-service-tls') }}/postfix-ca.crt
  register: postfix_cert_sync
  changed_when: false
  failed_when: false
