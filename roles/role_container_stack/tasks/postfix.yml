---
# Deploy and ensure desired state for Postfix Enterprise SMTP Relay container

- name: Check if Postfix container is running
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_postfix_container }}
  register: postfix_status
  failed_when: false
  changed_when: false

- name: Check if Postfix image exists locally
  ansible.builtin.command: >
    {{ stack_container_engine }} image exists {{ stack_postfix_image }}
  register: postfix_img_check
  failed_when: false
  changed_when: false

- name: Remove stopped Postfix container if not running
  ansible.builtin.command: >
    {{ stack_container_engine }} rm -f {{ stack_postfix_container }}
  when: postfix_status.rc == 0 and postfix_status.stdout != "running"

- name: Start Postfix Relay container if image available and not running
  ansible.builtin.command: >
    {{ stack_container_engine }} run -d
    --name {{ stack_postfix_container }}
    --network {{ stack_network_name }}
    --restart unless-stopped
    {{ stack_postfix_image }}
  when: postfix_img_check.rc == 0 and postfix_status.stdout != "running"
  ignore_errors: true
