---
# Deploy Alertmanager container via tmctl on Linux host
# Architecture Reference: TM-ADR-0025, TM-ADR-0026, TN-014, TN-019

- name: Check if Alertmanager container is running on Linux host
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_alertmanager_container }}
  register: alertmanager_status_linux
  failed_when: false
  changed_when: false

- name: Deploy Alertmanager container via tmctl on Linux host if not running
  ansible.builtin.command: >
    {{ stack_tmctl_bin }} stack deploy --target alertmanager --env {{ stack_deploy_env }} --config {{ stack_project_root }}/CONFIG
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when: (alertmanager_status_linux.stdout | default('') | trim) != "running"
