---
# Deploy Postfix Enterprise SMTP Relay container via tmctl on Linux host
# Architecture Reference: TM-ADR-0025, TM-ADR-0026, TN-014, TN-019

- name: Check if Postfix container is running on Linux host
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_postfix_container }}
  register: postfix_status_linux
  failed_when: false
  changed_when: false

- name: Deploy Postfix Relay container via tmctl on Linux host if not running
  ansible.builtin.command: >
    {{ stack_tmctl_bin }} stack deploy --target postfix --env {{ stack_deploy_env }} --config {{ stack_project_root }}/CONFIG
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when: (postfix_status_linux.stdout | default('') | trim) != "running"
  ignore_errors: true

- name: Ensure Postfix TLS certificate is synced for Diagnostic Service (Linux)
  ansible.builtin.command: >
    {{ stack_container_engine }} cp {{ stack_postfix_container }}:/etc/postfix/tls/server.crt {{ stack_tls_dir }}/postfix-ca.crt
  register: postfix_cert_sync
  changed_when: false
  failed_when: false
