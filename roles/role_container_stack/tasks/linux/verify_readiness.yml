---
# Verify readiness and health endpoints of the deployed stack on Linux
# Architecture Reference: TM-ADR-0025, TN-014, TN-019

- name: Wait for Mailpit API readiness on Linux host
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stack_mailpit_http_port }}/api/v1/messages"
    status_code: 200
  register: result_mailpit_linux
  until: result_mailpit_linux.status == 200
  retries: 15
  delay: 2
  when: "'all' in active_stack_components or 'mailpit' in active_stack_components"

- name: Wait for Prometheus readiness endpoint on Linux host
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stack_prometheus_port }}/-/ready"
    status_code: 200
  register: result_prom_linux
  until: result_prom_linux.status == 200
  retries: 15
  delay: 2
  when: "'all' in active_stack_components or 'prometheus' in active_stack_components"

- name: Wait for Alertmanager readiness endpoint on Linux host
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stack_alertmanager_port }}/-/ready"
    status_code: 200
  register: result_am_linux
  until: result_am_linux.status == 200
  retries: 15
  delay: 2
  when: "'all' in active_stack_components or 'alertmanager' in active_stack_components"

- name: Wait for Diagnostic Service health endpoint over HTTPS on Linux host
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ stack_diagnostic_port }}/health"
    validate_certs: false
    status_code: 200
  register: result_ds_linux
  until: result_ds_linux.status == 200
  retries: 15
  delay: 2
  when: "'all' in active_stack_components or 'diagnostic_service' in active_stack_components"

- name: Wait for Tomcat JMX Exporter metrics endpoint over HTTPS on Linux host
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ stack_tomcat_jmx_port }}/metrics"
    validate_certs: false
    status_code: 200
  register: result_jmx_linux
  until: result_jmx_linux.status == 200
  retries: 15
  delay: 2
  when: "'all' in active_stack_components or 'tomcat' in active_stack_components"

- name: Linux stack readiness summary
  ansible.builtin.debug:
    msg: "Active Linux monitoring stack services ({{ active_stack_components | join(', ') }}) are healthy and ready on host {{ inventory_hostname }}."

