---
# Deploy and ensure desired state for Prometheus container via tmctl
# Multi-OS Support: Linux & Windows

# ==============================================================================
# Linux Branch (ansible_os_family != "Windows")
# ==============================================================================
- name: Check if Prometheus container is running on Linux host
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_prometheus_container }}
  register: prometheus_status_linux
  failed_when: false
  changed_when: false
  when: ansible_os_family != "Windows"

- name: Deploy Prometheus container via tmctl on Linux host if not running
  ansible.builtin.command: >
    {{ stack_tmctl_bin }} stack deploy --target prometheus --env {{ stack_deploy_env }} --config {{ stack_project_root }}/CONFIG
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when:
    - ansible_os_family != "Windows"
    - (prometheus_status_linux.stdout | default('') | trim) != "running"

# ==============================================================================
# Windows Branch (ansible_os_family == "Windows")
# ==============================================================================
- name: Ensure Prometheus data directory exists on Windows host
  ansible.windows.win_file:
    path: "C:\\monitoring\\data\\prometheus"
    state: directory
  when: ansible_os_family == "Windows"

- name: Ensure Prometheus background process is running on Windows host
  ansible.windows.win_powershell:
    script: |
      $proc = Get-Process -Name prometheus -ErrorAction SilentlyContinue
      if (-not $proc) {
          $res = wmic process call create 'C:\monitoring\bin\prometheus.exe --config.file=C:\monitoring\config\prometheus\prometheus.yml --storage.tsdb.path=C:\monitoring\data\prometheus --web.listen-address=0.0.0.0:9090 --web.enable-lifecycle'
          Start-Sleep -Seconds 2
          $proc = Get-Process -Name prometheus -ErrorAction SilentlyContinue
          if ($proc) {
              $Ansible.Changed = $true
              $Ansible.Result = "Started prometheus PID $($proc.Id)"
          } else {
              throw "Failed to start prometheus process"
          }
      } else {
          $Ansible.Changed = $false
          $Ansible.Result = "prometheus already running PID $($proc.Id)"
      }
  when: ansible_os_family == "Windows"


