---
# Deploy and ensure desired state for Prometheus container

- name: Check if Prometheus container is running
  ansible.builtin.command: >
    {{ stack_container_engine }} inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ stack_prometheus_container }}
  register: prometheus_status
  failed_when: false
  changed_when: false

- name: Deploy Prometheus container via deploy script
  ansible.builtin.shell: >
    bash {{ stack_project_root }}/scripts/deploy-prometheus.sh
  environment:
    CONTAINER_ENGINE: "{{ stack_container_engine }}"
  when: prometheus_status.stdout != "running"
