---
# Deploy Prometheus TSDB Linux container on Windows host (WSL2 / Docker Desktop)
# Architecture Reference: TM-ADR-0026, TM-ADR-0028, TN-019

- name: Check if Prometheus Linux container is running on Windows host
  ansible.windows.win_command: >
    {{ stack_container_engine | default('docker') }} inspect --format "{{ '{{' }}.State.Status{{ '}}' }}" {{ stack_prometheus_container }}
  register: win_prom_container_status
  failed_when: false
  changed_when: false

- name: Remove stopped/stale Prometheus container on Windows host if needed
  ansible.windows.win_command: >
    {{ stack_container_engine | default('docker') }} rm -f {{ stack_prometheus_container }}
  when:
    - win_prom_container_status.rc == 0
    - (win_prom_container_status.stdout | trim) != "running"

- name: Run Prometheus Linux container on Windows host
  ansible.windows.win_command: >
    {{ stack_container_engine | default('docker') }} run -d
    --name {{ stack_prometheus_container }}
    --hostname {{ stack_prometheus_container }}
    --network {{ stack_network_name | default('monitoring_net') }}
    -p {{ stack_prometheus_port }}:9090
    -v {{ project_root }}\config\prometheus:/etc/prometheus
    -v prometheus_data:/prometheus
    --restart unless-stopped
    {{ stack_prometheus_image }}
  when: (win_prom_container_status.stdout | default('') | trim) != "running"
