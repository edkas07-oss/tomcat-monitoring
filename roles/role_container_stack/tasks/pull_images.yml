---
# Verify presence and pull container images according to image pull policy
# Multi-OS Support: Linux & Windows

- name: Build list of container stack images to inspect
  ansible.builtin.set_fact:
    stack_images_list:
      - "{{ stack_mailpit_image }}"
      - "{{ stack_tomcat_jmx_image }}"
      - "{{ stack_prometheus_image }}"
      - "{{ stack_alertmanager_image }}"
      - "{{ stack_diagnostic_image }}"
      - "{{ stack_postfix_image }}"

# ==============================================================================
# Linux Branch (ansible_os_family != "Windows")
# ==============================================================================
- name: Check existence of images locally on Linux host
  ansible.builtin.command: >
    {{ stack_container_engine }} image inspect {{ item }}
  register: image_exists_results_linux
  loop: "{{ stack_images_list }}"
  failed_when: false
  changed_when: false
  when: ansible_os_family != "Windows"

- name: Pull missing images when pull policy is IfNotPresent on Linux host
  ansible.builtin.command: >
    {{ stack_container_engine }} pull
    {{ '--tls-verify=' ~ (stack_registry_tls_verify | string | lower) if stack_container_engine == 'podman' else '' }}
    {{ ('--authfile ' ~ stack_registry_auth_file) if (stack_container_engine == 'podman' and stack_registry_auth_file | length > 0) else '' }}
    {{ item.item }}
  loop: "{{ image_exists_results_linux.results | default([]) }}"
  when:
    - ansible_os_family != "Windows"
    - stack_image_pull_policy == 'IfNotPresent'
    - item.rc != 0
    - not (item.item is match('^localhost/.*'))
  failed_when: false

- name: Force pull images when pull policy is Always on Linux host
  ansible.builtin.command: >
    {{ stack_container_engine }} pull
    {{ '--tls-verify=' ~ (stack_registry_tls_verify | string | lower) if stack_container_engine == 'podman' else '' }}
    {{ ('--authfile ' ~ stack_registry_auth_file) if (stack_container_engine == 'podman' and stack_registry_auth_file | length > 0) else '' }}
    {{ item }}
  loop: "{{ stack_images_list }}"
  when:
    - ansible_os_family != "Windows"
    - stack_image_pull_policy == 'Always'
    - not (item is match('^localhost/.*'))
  failed_when: false

# ==============================================================================
# Windows Branch (ansible_os_family == "Windows")
# ==============================================================================
- name: Ensure C:\monitoring\bin exists on Windows host
  ansible.windows.win_file:
    path: "C:\\monitoring\\bin"
    state: directory
  when: ansible_os_family == "Windows"

- name: Probe candidate paths for Windows Prometheus binary on control node
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ playbook_dir }}/roles/role_container_stack/files/windows_amd64/prometheus.exe"
    - "/home/eddywiyatno/git/tomcat-monitoring/roles/role_container_stack/files/windows_amd64/prometheus.exe"
  register: win_prom_probes
  delegate_to: localhost
  when: ansible_os_family == "Windows"

- name: Probe candidate paths for Windows Alertmanager binary on control node
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ playbook_dir }}/roles/role_container_stack/files/windows_amd64/alertmanager.exe"
    - "/home/eddywiyatno/git/tomcat-monitoring/roles/role_container_stack/files/windows_amd64/alertmanager.exe"
  register: win_am_probes
  delegate_to: localhost
  when: ansible_os_family == "Windows"

- name: Probe candidate paths for Windows Mailpit binary on control node
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ playbook_dir }}/roles/role_container_stack/files/windows_amd64/mailpit.exe"
    - "/home/eddywiyatno/git/tomcat-monitoring/roles/role_container_stack/files/windows_amd64/mailpit.exe"
  register: win_mailpit_probes
  delegate_to: localhost
  when: ansible_os_family == "Windows"

- name: Resolve Windows stack binaries source paths
  ansible.builtin.set_fact:
    win_prom_resolved_src: "{{ (win_prom_probes.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"
    win_am_resolved_src: "{{ (win_am_probes.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"
    win_mailpit_resolved_src: "{{ (win_mailpit_probes.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"
  when: ansible_os_family == "Windows"

- name: Deploy Prometheus binary to C:\monitoring\bin on Windows host
  ansible.windows.win_copy:
    src: "{{ win_prom_resolved_src }}"
    dest: "C:\\monitoring\\bin\\prometheus.exe"
  when:
    - ansible_os_family == "Windows"
    - win_prom_resolved_src | default('') | length > 0

- name: Deploy Alertmanager binary to C:\monitoring\bin on Windows host
  ansible.windows.win_copy:
    src: "{{ win_am_resolved_src }}"
    dest: "C:\\monitoring\\bin\\alertmanager.exe"
  when:
    - ansible_os_family == "Windows"
    - win_am_resolved_src | default('') | length > 0

- name: Deploy Mailpit binary to C:\monitoring\bin on Windows host
  ansible.windows.win_copy:
    src: "{{ win_mailpit_resolved_src }}"
    dest: "C:\\monitoring\\bin\\mailpit.exe"
  when:
    - ansible_os_family == "Windows"
    - win_mailpit_resolved_src | default('') | length > 0



