# ==============================================================================
# Fleet Infrastructure & Host Daemon Provisioning Playbook
# ==============================================================================
- name: Fleet Infrastructure and Host Daemon Provisioning
  hosts: all
  gather_facts: true
  serial: "{{ serial_batch | default('100%') }}"
  max_fail_percentage: 0

  roles:
    - role: role_host_prep
      tags: [host_prep, infrastructure]

    - role: role_event_collector
      tags: [event_collector, daemon]
